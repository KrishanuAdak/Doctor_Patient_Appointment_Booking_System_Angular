<div class="container-fluid px-0">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-4">

    <a class="navbar-brand fw-bold fs-4 text-primary" routerLink="/dashboard">
      🏥 Doctor-Patient Portal
    </a>

    <ul class="navbar-nav ms-auto align-items-center gap-3">

      <li class="nav-item">
        <a routerLink="/accounts" class="nav-link">Accounts</a>
      </li>

      <li class="nav-item">
        <a routerLink="/appointments" class="nav-link">Appointments</a>
      </li>

      <li class="nav-item">
        <a routerLink="/contact-us" class="nav-link">Contact Us</a>
      </li>

      <li class="nav-item"
          *ngIf="userRole?.toLowerCase()=='doctor'">
        <a routerLink="/available" class="nav-link">
          Doctor Options
        </a>
      </li>

      <li>
        <button class="btn btn-outline-danger rounded-pill"
                (click)="logout()">
          Logout
        </button>
      </li>

    </ul>
  </nav>


  <!-- HERO -->
  <div class="hero-section p-5">

    <div class="text-center mb-5">
      <h1 class="fw-bold">
        Book Appointments with Trusted Doctors
      </h1>

      <p class="text-muted">
        Search doctors and book appointments instantly.
      </p>
    </div>


    <!-- SEARCH BAR -->
    <div class="card shadow-lg border-0 rounded-5 p-4">

      <div class="row g-3">

        <div class="col-md-4">
          <input class="form-control rounded-pill"
                 placeholder="Search Doctor">
        </div>

        <div class="col-md-3">
          <select class="form-select rounded-pill">

            <option>Select Location</option>
            <option>Kolkata</option>
            <option>Bangalore</option>
            <option>Delhi</option>

          </select>
        </div>

        <div class="col-md-3">
          <select class="form-select rounded-pill">

            <option>Speciality</option>
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedic</option>

          </select>
        </div>

        <div class="col-md-2">
          <button class="btn btn-primary rounded-pill w-100">
            Search
          </button>
        </div>

      </div>

    </div>

  </div>


  <!-- AVAILABLE DOCTORS -->
  <div class="container mt-5">

    <h3 class="fw-bold mb-4">
      Available Doctors
    </h3>

    <div class="row">

      <div class="col-md-3 mb-4"
           *ngFor="let doctor of doctors">

        <div class="card border-0 shadow rounded-4 p-3">

          <img [src]="doctor.imageUrl"
               class="rounded-circle mx-auto"
               width="100">

          <h5 class="mt-3 text-center">
            {{doctor.name}}
          </h5>

          <p class="text-muted text-center">
            {{doctor.specialization}}
          </p>

          <button class="btn btn-primary rounded-pill">
            Book Appointment
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
