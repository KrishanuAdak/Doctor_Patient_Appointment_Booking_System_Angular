<div class="appointment-wrapper" [@fadeInAnimation]>
  <mat-card class="appointment-card">
    <mat-card-title>Book an Appointment</mat-card-title>
    <mat-card-content>
      <form [formGroup]="appointmentForm" (ngSubmit)="bookAppointment()">
        
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Select Doctor</mat-label>
          <mat-select formControlName="doctorId">
            <mat-option *ngFor="let doc of doctors" [value]="doc.id">
              {{ doc.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Appointment Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="appointmentDate">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Appointment Time</mat-label>
          <input matInput type="time" formControlName="appointmentTime">
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="3"></textarea>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
          <mat-progress-spinner *ngIf="isLoading" mode="indeterminate" diameter="20"></mat-progress-spinner>
          <span *ngIf="!isLoading">Book Appointment</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
