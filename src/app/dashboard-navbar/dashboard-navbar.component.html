<div class="nb-wrap">
  <nav class="navbar">

    <!-- Logo -->
    <a class="nb-logo nb-logo-enter" routerLink="/">
      <div class="nb-logo-icon">🏥</div>
      <div class="nb-logo-text">MediCare</div>
    </a>

    <!-- Nav Links -->
    <div class="nb-links" #nbLinks>
      <div class="nb-pill" #nbPill></div>

      <div
        *ngFor="let link of navLinks"
        class="nb-link nb-link-enter"
        [class.active]="activeIdx === link.idx"
        [style.animation-delay]="(0.1 + link.idx * 0.06) + 's'"
        (click)="setActive(link.idx)">
        <i class="ti {{ link.icon }}"></i>
        <span>{{ link.label }}</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="nb-actions nb-act-enter">
      <div class="nb-notif" title="Notifications">
        <i class="ti ti-bell"></i>
        <div class="nb-dot"></div>
      </div>
      <button class="nb-btn nb-btn-ghost">Sign in</button>
      <button class="nb-btn nb-btn-solid">Get started</button>
      <div class="nb-avatar" title="Krish">{{username}}</div>
    </div>

  </nav>

  <!-- Active page hint -->
  <div class="nb-preview">
    <div class="nb-preview-text">Active page</div>
    <div class="nb-page-hint">
      <span class="blink-dot"></span>
      <span class="page-label">{{ activeLabel }}</span>
    </div>
  </div>
</div>
