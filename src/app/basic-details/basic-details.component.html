<div class="registration-container">
  <mat-card class="registration-card">
    <mat-card-header>
      <mat-card-title>👨‍⚕️ Doctor Basic Details</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="doctorForm" (ngSubmit)="registerDoctor()" class="doctor-form">

        <!-- Existing Form Fields -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="name" placeholder="Dr. John Doe">
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Specialization</mat-label>
          <mat-select formControlName="specialization">
            <mat-option value="Cardiologist">Cardiologist</mat-option>
            <mat-option value="Dentist">Dentist</mat-option>
            <mat-option value="Dermatologist">Dermatologist</mat-option>
            <mat-option value="Pediatrician">Pediatrician</mat-option>
            <mat-option value="Neurologist">Neurologist</mat-option>
            <mat-option value="Orthopedic">Orthopedic</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Qualification</mat-label>
          <input matInput formControlName="qualification" placeholder="MBBS, MD">
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Experience (Years)</mat-label>
          <input matInput type="number" formControlName="experience" min="0">
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Consultation Fees (₹)</mat-label>
          <input matInput type="number" formControlName="fees" min="0">
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Contact Number</mat-label>
          <input matInput type="tel" formControlName="contactNumber" maxlength="10" matInput
            type="tel"
            formControlName="contactNumber"
            maxlength="10"
            placeholder="10-digit number">
            <!-- (keypress)="allowOnlyNumbers($event)"> -->
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Clinic Address</mat-label>
          <textarea matInput formControlName="clinicAddress" rows="3"></textarea>
        </mat-form-field>

        <!-- Available Days -->
       
        <!-- File Upload Section -->
        <div class="file-upload">
          <label for="registrationFile" class="file-label">
            <mat-icon>upload</mat-icon>
            <span>{{ fileName || 'Upload Registration File (PDF/JPG/PNG)' }}</span>
          </label>
          <input id="registrationFile" type="file" (change)="onFileSelected($event)" accept=".pdf,.jpg,.png" hidden>
        </div>

        <div class="button-container">
          <button mat-raised-button color="primary" type="submit">
            Submit for Verification
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
